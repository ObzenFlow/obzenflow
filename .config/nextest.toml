# Includes the concurrent capture-pipe inheritance fix on macOS (nextest #3553).
nextest-version = { required = "0.9.146" }

[profile.default]
slow-timeout = { period = "60s", terminate-after = 1 }
retries = 0
# Keep the failing phase output beside the final CI summary as well.
failure-output = "immediate-final"
# B15: keep the pinned runner's wait; a detected output-handle leak is a failure.
leak-timeout = { period = "200ms", result = "fail" }
status-level = "leak"
final-status-level = "fail"

# Cheap defect controls get a slot before the full archive/scale obligations.
[[profile.default.overrides]]
filter = "test(archive_observation_rewrite_preserves_both_metrics_consumers) | test(validation::) | test(=web::endpoints::studio::tests::stream::composed_stall_reports_source_progress_before_recovery)"
priority = 100

# Expensive proofs own temporary journals. Two concurrent proofs leave capacity
# for other tests on four-slot CI runners.
[[profile.default.overrides]]
filter = "binary(=obzenflow_infra) & test(=web::endpoints::studio::tests::stream::many_stage_pipeline_metrics_and_studio_settle_owned_journals)"
priority = 80
test-group = "expensive-journal-proofs"
# Repeating a minute-long failure delays feedback and cannot qualify the fix.
retries = 0

[profile.ci-fast]
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 1 }
retries = 0
fail-fast = false
# Local acceptance, PRs and main use this same profile and retry policy.

[profile.ci-fast.junit]
path = "junit.xml"
store-success-output = true
store-failure-output = true

[profile.ci-full]
# Supplementary diagnosis only; this profile cannot replace acceptance.
test-threads = 4
slow-timeout = { period = "300s", terminate-after = 2 }
retries = 0
fail-fast = false

[profile.ci-full.junit]
path = "junit.xml"
store-success-output = true
store-failure-output = true

# Temporary 145h merge budget, authorised 2026-09-27. Reassess this exception
# in FLOWIP-145i; Criterion owns performance acceptance.
# The composed test keeps all four cases and every journal/Studio assertion.
[[profile.ci-fast.overrides]]
filter = "binary(=obzenflow_infra) & test(=web::endpoints::studio::tests::stream::many_stage_pipeline_metrics_and_studio_settle_owned_journals)"
slow-timeout = { period = "120s", terminate-after = 1 }

[[profile.ci-fast.overrides]]
filter = "kind(test) & ((test(/^[a-z0-9_]*metrics[a-z0-9_]*::/) & not package(obzenflow)) | (package(obzenflow) & test(/^metrics::(exporter|stateful)::/)))"
test-group = "metrics-exporter-port"

[[profile.ci-full.overrides]]
filter = "kind(test) & ((test(/^[a-z0-9_]*metrics[a-z0-9_]*::/) & not package(obzenflow)) | (package(obzenflow) & test(/^metrics::(exporter|stateful)::/)))"
test-group = "metrics-exporter-port"

[[profile.ci-fast.overrides]]
filter = "kind(test) & (test(/^(stateless_simple_test|stateful_patterns_test|stateful_primitives_test)::/) | (package(obzenflow) & test(/^pipeline::cycle_unified_guard::/)))"
test-group = "disk-journal-paths"

[[profile.ci-full.overrides]]
filter = "kind(test) & (test(/^(stateless_simple_test|stateful_patterns_test|stateful_primitives_test)::/) | (package(obzenflow) & test(/^pipeline::cycle_unified_guard::/)))"
test-group = "disk-journal-paths"

[test-groups.expensive-journal-proofs]
max-threads = 2

[test-groups.metrics-exporter-port]
max-threads = 1

[test-groups.disk-journal-paths]
max-threads = 1
