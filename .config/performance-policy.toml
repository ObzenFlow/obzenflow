# FLOWIP-080n extends ordinary-operation validity coverage and separates allocation
# census binaries from timing; selected timing cases and thresholds stay fixed.
# FLOWIP-145i B8: public-operations-v1, without framework instrumentation.
# All 75 public-operation validity cases are required on both implementations.
# This contract measures median sampled time, not a tail-latency SLO.
# FLOWIP-080v B10: the reference is where the measured change started (its merge
# base with main, or its first parent on main). Set `pin = "<40-hex commit>"` only
# for a deliberate re-qualification against a fixed reference.
version = 5
hot_path_validity_cases = 75
statistic = "median"
sample_size = 40
warm_up_ms = 1000
measurement_ms = 3000
# These limits remain unchanged during B8 requalification. Earlier instrumented
# timings do not qualify this contract. Inconclusive runs never trigger retries
# or automatic threshold/baseline changes.
allowed_regression = 0.25
allowed_control_drift = 0.15
maximum_relative_interval_width = 0.12
# Precision is required to certify a pass. A valid confidence interval entirely
# beyond the regression limit proves failure even if it is wider than this bound.
cases = [
    "reader_dispatch/full/actual_reader/readers_8",
    "reader_dispatch/full/actual_reader/readers_32",
    "journal_append_cost/complete_append/ordinary_business_64",
    "journal_append_cost/complete_append/large_business_64",
]
# Single-reader dispatch and grouped append remain in the 75 required validity
# cases and the ordinary Criterion suite. Their short operations did not qualify
# for stable timing gates; preserved trials exceeded the same precision/drift
# rules. The selected timing gate covers 8/32-reader work and ordinary/large
# appends, plus the five operation boundaries below. It makes no timing acceptance
# claim for the three diagnostic cases.
boundary_cases = [
    "archive_validation/export/inputs_1000",
    "archive_validation/admit_and_read/inputs_1000",
    "replay_validation/streaming_comparison/inputs_10000",
    "metrics_validation/tail_refresh/data_and_error_64",
    "studio_validation/project_and_snapshot/inputs_64",
]
