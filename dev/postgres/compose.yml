services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: obzenflow
      POSTGRES_DB: obzenflow
      POSTGRES_HOST_AUTH_METHOD: trust
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    ports:
      - target: 5432
        published: "${OBZENFLOW_POSTGRES_HOST_PORT:-0}"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD", "psql", "-U", "obzenflow", "-d", "obzenflow", "-Atqc", "SELECT 1"]
      interval: 1s
      timeout: 3s
      retries: 30
    labels:
      dev.obzenflow.service: postgres-proof
      dev.obzenflow.authentication: trust-local-development
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro

volumes:
  postgres-data:
