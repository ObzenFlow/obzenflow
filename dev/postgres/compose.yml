services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: obzenflow
      POSTGRES_PASSWORD: ${OBZENFLOW_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: obzenflow
    entrypoint:
      - /bin/bash
      - /usr/local/bin/obzenflow-postgres-entrypoint.sh
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/obzenflow-tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/obzenflow-tls/server.key
    ports:
      - 127.0.0.1:${OBZENFLOW_POSTGRES_PORT:?required}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obzenflow -d obzenflow"]
      interval: 1s
      timeout: 3s
      retries: 30
    labels:
      dev.obzenflow.service: postgres-proof
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${OBZENFLOW_POSTGRES_TLS_DIR:?required}/server.crt:/run/obzenflow-postgres-tls/server.crt:ro
      - ${OBZENFLOW_POSTGRES_TLS_DIR:?required}/server.key:/run/obzenflow-postgres-tls/server.key:ro
      - ./postgres-entrypoint.sh:/usr/local/bin/obzenflow-postgres-entrypoint.sh:ro

volumes:
  postgres-data:
