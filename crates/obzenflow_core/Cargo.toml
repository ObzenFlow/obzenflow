[package]
name = "obzenflow_core"
description = "Core domain layer for ObzenFlow - pure abstractions with minimal dependencies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
# Fail closed on shipped artifact types. Tests and repository-only files remain
# in Git and CI rather than in the crates.io source archive.
include = [
    "/src/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/TRADEMARKS.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/NOTICE",
]

[dependencies]
# Core domain dependencies - minimal
obzenflow_core_derive = { workspace = true }
ulid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
ring = { workspace = true }
futures-core = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
