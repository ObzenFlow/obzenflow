[package]
name = "obzenflow_dsl"
description = "DSL and infrastructure layer for ObzenFlow - flow! macro and high-level orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
# Fail closed on shipped artifact types. Tests and repository-only files remain
# in Git and CI rather than in the crates.io source archive.
include = [
    "/src/**/*.rs",
    "/src/dsl/README.md",
    "/Cargo.toml",
    "/README.md",
    "/TRADEMARKS.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/NOTICE",
]

[features]
test-support = ["obzenflow_runtime/test-support"]

[dependencies]
# Internal dependencies - all layers needed for DSL
obzenflow_core = { workspace = true }
obzenflow-topology = { workspace = true }
obzenflow_runtime = { workspace = true }
obzenflow_adapters = { workspace = true }

# Core dependencies
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tokio-test = { workspace = true }
