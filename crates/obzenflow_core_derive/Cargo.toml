[package]
name = "obzenflow_core_derive"
description = "Procedural derives for Core-owned ObzenFlow contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
# Fail closed on shipped artifact types. Tests and repository-only files remain
# in Git and CI rather than in the crates.io source archive.
include = [
    "/src/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/TRADEMARKS.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/NOTICE",
]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
