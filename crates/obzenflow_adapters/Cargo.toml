[package]
name = "obzenflow_adapters"
description = "Adapters layer for ObzenFlow - interfaces and monitoring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[dependencies]
# Internal dependencies
obzenflow_core = { workspace = true }
obzenflow_runtime = { workspace = true }

# Adapter layer dependencies
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
csv = { workspace = true }
http = { workspace = true }
ring = { workspace = true }
sqlx = { workspace = true, optional = true }

[features]
default = []
postgres = ["dep:sqlx"]
test-support = ["obzenflow_runtime/test-support"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
chrono = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "postgres_sink_conformance_test"
path = "tests/postgres_sink_conformance_test.rs"
required-features = ["postgres", "test-support"]
