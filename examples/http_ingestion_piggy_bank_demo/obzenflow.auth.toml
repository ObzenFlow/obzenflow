[server]
enabled = true

[server.control_plane_auth]
mode = "api_key"
value_env = "OBZENFLOW_PIGGY_BANK_CONTROL_PLANE_AUTH"

[metrics]
enabled = true

# The demo's own settings. Relative paths resolve against the working directory.
[app]
accounts_file = "examples/http_ingestion_piggy_bank_demo/accounts.yaml"
transactions_file = "examples/http_ingestion_piggy_bank_demo/transactions.csv"
