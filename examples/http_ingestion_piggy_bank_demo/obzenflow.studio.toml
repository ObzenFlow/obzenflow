# Studio walkthrough config, selected with
#   --config examples/http_ingestion_piggy_bank_demo/obzenflow.studio.toml
# The runtime registers with the phonebook and the browser attaches directly
# to this process's port; the phonebook never proxies the data path.

[server]
enabled = true
host = "127.0.0.1"
port = 9090
startup_mode = "manual"

# Every browser request to this runtime is cross-origin, from the Studio
# bundle on the phonebook origin.
[server.cors]
mode = "allow-list"
# 7010 = the studiod-served bundle origin; 8080 = the `trunk serve` UI-dev
# origin. Both loopback; 127.0.0.1 and localhost are distinct origins.
allow_origins = [
    "http://127.0.0.1:7010",
    "http://localhost:7010",
    "http://127.0.0.1:8080",
    "http://localhost:8080",
]

[studio]
enabled = true
phonebook_url = "http://127.0.0.1:7010"
job_id = "piggy_bank"
advertise_url = "http://127.0.0.1:9090"

[metrics]
enabled = true

# The demo's own settings, as in obzenflow.toml, which --config replaces.
# Relative paths resolve against the working directory.
[app]
accounts_file = "examples/http_ingestion_piggy_bank_demo/accounts.yaml"
transactions_file = "examples/http_ingestion_piggy_bank_demo/transactions.csv"
