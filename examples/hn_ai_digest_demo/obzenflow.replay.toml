# The generated map and reduce members each reserve their complete three-row
# direct-fact bound before starting a live chat continuation.
[runtime.backpressure.flow]
mode = "enforce"
window = 3
stall_timeout_ms = 300000

# With `source = "live"`, the flow reads the Hacker News API. With `source = "mock"`, it reads scripted stories.
# Pacing is `events_per_second` under [middleware.stages.hn_stories.rate_limiter].
# `output` publishes the digest to the console or, with "postgres", to PostgreSQL.
[app]
source = "live"
output = "console"
max_stories = 60
poll_timeout_secs = 120
# Interests personalize both prompts and form part of every chat effect's
# identity, so a replay or resume with different interests refuses.
# interests = "rust, ai, security"

[app.digest]
# Stories per group, 1 or more.
group_max_stories = 10
