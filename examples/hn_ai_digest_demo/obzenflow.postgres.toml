# PostgreSQL-output variant of the HN AI digest example. The repository
# development service supplies its passwordless connection, schema, and transport
# when this config is launched through `cargo xtask postgres run`.

# The generated map and reduce members each reserve their complete three-row
# direct-fact bound before starting a live chat continuation.
[runtime.backpressure.flow]
mode = "enforce"
window = 3
stall_timeout_ms = 30000

# Every chat stage's endpoint and model. The built-in `ollama` endpoint needs
# no table. Secrets are read only when a live call first needs them.
[ai.models]
endpoint = "ollama"
model = "llama3.1:8b"

[sinks]
handler = "postgres_sink"

# The demo's own settings, as in obzenflow.toml.
[app]
source = "mock"
max_stories = 60
poll_timeout_secs = 120

[app.digest]
group_max_stories = 10
