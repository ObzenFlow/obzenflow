[server]
# The documented default command is a terminal run and must not require the
# optional warp-server feature. Pass --server (with that feature enabled) to
# opt into the control plane; the CLI flag takes precedence over this value.
enabled = false
# Explicit server runs build the pipeline, expose endpoints, and wait for the
# UI's Play so the UI can attach before the finite sources complete.
startup_mode = "manual"

[server.cors]
# allow-any-origin: development/demo default so the Trunk-served UI on
# 127.0.0.1:8080 can fetch /api/topology + /api/flow/events from the
# obzenflow server on localhost:9090. Tighten to "allow-list" + populate
# server.cors.allow_origins for production.
mode = "allow-any-origin"
