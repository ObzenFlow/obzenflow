[runtime.backpressure.flow]
mode = "enforce"
window = 64
stall_timeout_ms = 30000

[runtime.backpressure.stages.daily_profile.edges.alerts]
mode = "track"

[app]
account_history = "data/aml-history-2022-09-05.csv"
transactions = "data/aml-2022-09-05.csv"
risk_ledger = "target/aml-risk-calls.jsonl"
case_ledger = "target/aml-case-calls.jsonl"
cleared_register = "target/aml-cleared.csv"
case_register = "target/aml-cases.csv"

[app.rules]
fan_out_counterparties = 10
fan_in_counterparties = 10
