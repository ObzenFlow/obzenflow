[server]
enabled = true
# Manual: build the pipeline, expose endpoints, wait for the UI's Play.
# Without this, --server runs the flow immediately and exits before the UI
# can attach.
startup_mode = "manual"

[server.cors]
# allow-any-origin: development/demo default so the Trunk-served UI on
# 127.0.0.1:8080 can fetch /api/topology + /api/flow/events from the
# obzenflow server on localhost:9090. Tighten to "allow-list" + populate
# server.cors.allow_origins for production.
mode = "allow-any-origin"

# This example explicitly opts into monitoring; ordinary framework launches do not.
[metrics]
enabled = true

# Journal attachments and live reporting have independent clocks.
[runtime.observability]
mode = "periodic"
interval_ms = 250
export_interval_ms = 250

# Enforced backpressure: at most 64 unacknowledged events per edge.
[runtime.backpressure.flow]
mode = "enforce"
window = 64
stall_timeout_ms = 30000

# The demo's own settings, at their defaults. source_rate_limit = false omits
# the 1,000/s source limiter for measurement.
[app]
event_count = 100000
source_rate_limit = true
