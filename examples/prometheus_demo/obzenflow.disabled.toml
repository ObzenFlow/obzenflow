# A deterministic witness of 100 inputs, without hosting or metrics.
[server]
enabled = false
host = "127.0.0.1"
port = 9090
startup_mode = "auto"
on_terminal = "exit"

[metrics]
enabled = false

[runtime.backpressure.flow]
mode = "enforce"
window = 64
stall_timeout_ms = 30000

# The demo's own settings. 100 inputs finish before the first simulated outage.
[app]
event_count = 100
