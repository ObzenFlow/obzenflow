[package]
name = "obzenflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A durable execution runtime for building event-sourced streaming workflows."
license.workspace = true
repository.workspace = true
keywords = ["durable-execution", "event-sourcing", "workflow", "streaming", "replay"]
publish = true
autobins = false
autotests = false

# Fail closed on shipped artifact types. Tests, examples, and repository-only tooling
# remain in Git and CI rather than in the crates.io source archive.
include = [
    "/src/**/*.rs",
    "/src/**/README.md",
    "/Cargo.toml",
    "/README.md",
    "/TRADEMARKS.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/NOTICE",
]

[[bin]]
name = "obzenflow"
path = "src/bin/obzenflow.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

# FLOWIP-134i B4: re-executes itself as each run and drives the CLI binary.
# FLOWIP-084l: its HTTP rows host ingress in each run.
[[test]]
name = "durable_execution_contract"
path = "tests/durable_execution_contract.rs"
required-features = ["cli", "web-host"]

[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
# Build all workspace members by default (excluding the root package)
# Note: obzenflow_benchmarks is excluded from default-members as it's only for benchmarking
default-members = [
    "crates/obzenflow_core_derive",
    "crates/obzenflow_core",
    "crates/obzenflow_runtime",
    "crates/obzenflow_adapters",
    "crates/obzenflow_dsl",
    "crates/obzenflow_infra"
]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/obzenflow/obzenflow"
homepage = "https://obzenflow.dev"

[workspace.dependencies]
# Workspace crates
obzenflow_core_derive = { version = "=0.4.0", path = "crates/obzenflow_core_derive" }
obzenflow_core = { version = "=0.4.0", path = "crates/obzenflow_core" }
obzenflow_runtime = { version = "=0.4.0", path = "crates/obzenflow_runtime" }
obzenflow_adapters = { version = "=0.4.0", path = "crates/obzenflow_adapters" }
obzenflow_dsl = { version = "=0.4.0", path = "crates/obzenflow_dsl" }
obzenflow_infra = { version = "=0.4.0", path = "crates/obzenflow_infra" }
obzenflow_benchmarks = { version = "=0.4.0", path = "crates/obzenflow_benchmarks" }

# External ObzenFlow crates
obzenflow-topology = "0.8.0"
obzenflow-fsm = "0.4.0"

	# Async/runtime + utilities
	tokio = "1"
	tokio-test = "0.4"
	tokio-stream = "0.1"
	async-trait = "0.1"
	futures = "0.3"
	futures-core = "0.3"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
console-subscriber = "0.5"

# Serialization / IDs / time
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
serde_urlencoded = "0.7"
toml = "0.8"
ulid = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Errors
thiserror = "1"
anyhow = "1"

# Proc-macro toolchain (obzenflow_core_derive)
proc-macro2 = "1"
quote = "1"
syn = "2"
strum_macros = "0.28"

# Core types
url = "2"
http = "1"
bytes = "1.11.1"

# Data structures
indexmap = "2"

# Metrics / profiling
hdrhistogram = "7.5"

# Randomness / system
sysinfo = "0.29"

# I/O and formats
csv = "1"
# Event-level YAML 1.2 parser; reports aliases, anchors, tags and spans (FLOWIP-084n B6).
saphyr-parser = "0.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres"] }

# Security / hashing
crc32fast = "1.3"
base64 = "0.22"
ring = "0.17"
subtle = "2"

	# Web / networking (optional in crates that use them)
	warp = { version = "0.4.3", default-features = false }
	headers = "0.4.1"
	hyper = { version = "1.8", default-features = false }
	hyper-util = { version = "0.1.19", default-features = false }
	tower-service = "0.3"
	reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "rustls-tls-native-roots", "system-proxy"] }
	rustls-native-certs = "0.8"
	matchit = "0.8"

	# Benchmarking / testing
	criterion = "0.5"
	insta = "1"
	proptest = "1.0"
	fastrand = "2.0"
	tempfile = "3.8"
	libc = "0.2"
	clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
no_effect_underscore_binding = "deny"
unused_result_ok = "deny"
used_underscore_binding = "deny"
await_holding_lock = "forbid"

[lints]
workspace = true

[dependencies]
# Internal workspace dependencies
obzenflow_core = { workspace = true }
obzenflow_runtime = { workspace = true }
obzenflow_adapters = { workspace = true }
obzenflow_dsl = { workspace = true }
obzenflow_infra = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

# Only the executable needs command parsing, an HTTP client and its own runtime.
clap = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json"], optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"], optional = true }

[dev-dependencies]
obzenflow_infra = { workspace = true, features = ["test-support"] }
crc32fast = { workspace = true }
# Used by examples/tests/benchmarks in this crate
tokio = { workspace = true, features = ["full", "tracing"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
sqlx = { workspace = true }
obzenflow-topology = { workspace = true }

tokio-test = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
fastrand = { workspace = true }
sysinfo = { workspace = true }
tempfile = { workspace = true }
futures = { workspace = true }
proc-macro2 = { workspace = true }
syn = { workspace = true, features = ["full", "visit"] }
toml = { workspace = true }
csv = { workspace = true }
chrono = { workspace = true }

[features]
cli = ["dep:clap", "dep:reqwest", "dep:tokio"]
prometheus = ["obzenflow_infra/prometheus"]
web-host = ["obzenflow_infra/warp-server"]
studio = ["prometheus", "web-host", "obzenflow_infra/studio-registration"]
tokio-console = ["obzenflow_infra/tokio-console"]
http = ["obzenflow_infra/reqwest-client"]
ai = ["obzenflow_infra/ai-rig", "obzenflow_infra/ai-tiktoken"]
postgres = ["obzenflow_adapters/postgres"]
# Selection gate for tests that require repository-managed external services.
# It carries no product code and is enabled only by the matching conformance job.
e2e = []
test-support = [
    "obzenflow_runtime/test-support",
    "obzenflow_dsl/test-support",
    "obzenflow_adapters/test-support",
    "obzenflow_infra/test-support",
]

[profile.dev]
debug = 0

# For debugger sessions: `cargo test --profile dev-with-debug`.
[profile.dev-with-debug]
inherits = "dev"
debug = true

[profile.release]
lto = true
codegen-units = 1

# Benchmark executables for profilers (FLOWIP-080v B8). Line tables keep inlined
# frames in flame graphs; frame pointers come from Cargo `--config` rustflags,
# as the benchmark README shows.
[profile.profiling]
inherits = "bench"
debug = "line-tables-only"
strip = false

# Benchmarks have been moved to crates/obzenflow_benchmarks
# Run benchmarks with: cargo bench -p obzenflow_benchmarks

