name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          import sys

          base_sha = os.environ.get("BASE_SHA")
          head_sha = os.environ.get("HEAD_SHA")

          if not base_sha or not head_sha:
            print("DCO check skipped: missing BASE_SHA/HEAD_SHA")
            sys.exit(0)

          def ensure_commit(sha: str) -> None:
            try:
              subprocess.check_call(["git", "cat-file", "-e", f"{sha}^{{commit}}"])
            except subprocess.CalledProcessError:
              subprocess.check_call(["git", "fetch", "--no-tags", "--depth", "1", "origin", sha])

          ensure_commit(base_sha)
          ensure_commit(head_sha)

          merge_base = (
            subprocess.check_output(["git", "merge-base", base_sha, head_sha], text=True)
            .strip()
          )

          commits = (
            subprocess.check_output(["git", "rev-list", f"{merge_base}..{head_sha}"], text=True)
            .splitlines()
          )

          missing: list[str] = []
          for sha in commits:
            message = subprocess.check_output(["git", "show", "-s", "--format=%B", sha], text=True)
            if "Signed-off-by:" not in message:
              missing.append(sha)

          if missing:
            print("DCO sign-off missing in one or more commits:")
            for sha in missing:
              subject = subprocess.check_output(
                ["git", "show", "-s", "--format=%s", sha],
                text=True,
              ).strip()
              print(f" - {sha[:7]} {subject}")
            print()
            print("Fix:")
            print(" - For a new commit:      git commit -s")
            print(" - For the last commit:   git commit --amend -s")
            print(" - For all branch commits: git rebase -i --signoff main")
            sys.exit(1)

          print(f"DCO sign-off OK in {len(commits)} commit(s).")
          PY

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt
      - name: Verify lockfile
        run: cargo fetch --locked
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

  clippy:
    needs: fmt
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            cargo_args: ""
          - name: all-features
            cargo_args: "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: clippy
      - name: Verify lockfile
        run: cargo fetch --locked
      - uses: Swatinem/rust-cache@v2

      - name: Clippy (${{ matrix.name }})
        run: cargo clippy --workspace --all-targets --locked ${{ matrix.cargo_args }} -- -D warnings

  test:
    # Preserve required-check names; xtask discovers production features.
    name: Tests (${{ matrix.name }})
    needs: fmt
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            lanes: --lane default --lane journal-fixtures
          - name: production-features
            lanes: --lane production-features
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.136
      - name: Validate the declared coverage
        run: cargo xtask test ${{ matrix.lanes }}
      - name: Preserve validation reports and phase output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: target/test-runs/
          if-no-files-found: error

  test-test-support:
    needs: fmt
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.136
      - name: Validate test-support
        # Exercise dependency preparation on PRs and main without an inherited
        # registry cache. Installed tools remain on PATH; target stays in place.
        env:
          CARGO_HOME: ${{ runner.temp }}/obzenflow-cargo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          test ! -e "$CARGO_HOME"
          mkdir "$CARGO_HOME"
          cargo xtask test --lane test-support
      - name: Preserve validation reports and phase output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-test-support
          path: target/test-runs/
          if-no-files-found: error

  postgres-conformance:
    needs: fmt
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.136
      - name: Validate postgres
        run: cargo xtask test --lane postgres
      - name: Preserve validation reports and phase output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-postgres
          path: target/test-runs/
          if-no-files-found: error

  doctest:
    needs: fmt
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.136
      - name: Validate doctest
        run: cargo xtask test --lane doctest
      - name: Preserve validation reports and phase output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-doctest
          path: target/test-runs/
          if-no-files-found: error

  performance:
    # FLOWIP-145i B12: PR iteration proves correctness; main and explicit
    # requests also qualify performance. Skipped is not measured or passed.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    needs: fmt
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.136
      - name: Validate performance
        run: cargo xtask test --lane performance
      - name: Preserve validation reports and phase output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-performance
          path: target/test-runs/
          if-no-files-found: error

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - name: Verify lockfile
        run: cargo fetch --locked
      - uses: Swatinem/rust-cache@v2

      - name: Verify validation cadence and release evidence
        uses: actions/github-script@v7
        with:
          script: |
            const assert = require("node:assert/strict");
            const fs = require("node:fs");
            const workflow = fs.readFileSync(".github/workflows/ci.yml", "utf8");
            const performance = workflow.split("\n  performance:\n")[1];
            const condition = performance.match(/    if: >-\n((?:      .*\n)+)/)[1].trim();
            const requestsPerformance = new Function("github", "return (" + condition + ");");
            for (const [event, ref, expected] of [
              ["pull_request", "refs/pull/129/merge", false],
              ["push", "refs/heads/main", true],
              ["push", "refs/heads/topic", false],
              ["workflow_dispatch", "refs/heads/topic", true],
            ]) {
              assert.equal(requestsPerformance({event_name: event, ref}), expected);
            }

            // Keep the existing required test-support job cold on both PR and
            // main. Tool installation and restored build output precede the
            // step-local Cargo home; no workflow preparation can warm it first.
            const coldJob = workflow.split("\n  test-test-support:\n")[1]
              .split(/\n  [a-zA-Z0-9_-]+:\n/)[0];
            const expression = name => "$" + "{{ " + name + " }}";
            const coldHome = expression("runner.temp") + "/obzenflow-cargo-"
              + expression("github.run_id") + "-" + expression("github.run_attempt")
              + "-" + expression("github.job");
            function verifyColdDependencyJob(job) {
              assert(!/^    if:/m.test(job), "cold coverage must run on PR and main");
              const [configuration, ...steps] = job.split("\n      - ");
              assert(!/CARGO_HOME/.test(configuration), "Cargo home is step-local");
              const selected = steps.filter(step => /cargo xtask test --lane test-support/.test(step));
              assert.equal(selected.length, 1, "one existing native lane invocation");
              const validation = selected[0];
              const index = steps.indexOf(validation);
              assert(!/^        if:/m.test(validation), "cold validation is unconditional");
              const rust = steps.findIndex(step => step.includes("dtolnay/rust-toolchain@"));
              const nextest = steps.findIndex(step => step.includes("tool: cargo-nextest@"));
              assert(rust >= 0 && rust < index, "install Rust before changing Cargo home");
              assert(nextest >= 0 && nextest < index, "install Nextest before changing Cargo home");
              assert(steps.every((step, position) => position === index || !/CARGO_HOME|obzenflow-cargo-/.test(step)),
                "no other step can populate the isolated dependency home");
              const environment = validation.match(/        env:\n((?:          .*\n)+)/)?.[1];
              assert.deepEqual(environment?.trim().split(/\n\s*/), ["CARGO_HOME: " + coldHome],
                "preserve installed tool PATH and existing target configuration");
              const commands = validation.match(/        run: \|\n((?:          .*\n?)+)/)?.[1];
              assert.deepEqual(commands?.trim().split(/\n\s*/), [
                'test ! -e "$CARGO_HOME"',
                'mkdir "$CARGO_HOME"',
                "cargo xtask test --lane test-support",
              ], "prove fresh state immediately before the unchanged native command");
            }
            verifyColdDependencyJob(coldJob);
            for (const broken of [
              "    if: github.event_name == 'push'\n" + coldJob,
              coldJob.replace('          test ! -e "$CARGO_HOME"\n', ""),
              coldJob.replace('          mkdir "$CARGO_HOME"', '          mkdir -p "$CARGO_HOME"'),
              coldJob.replace("          cargo xtask test", "          cargo fetch --locked\n          cargo xtask test"),
              coldJob.replace("        env:\n", "        env:\n          PATH: /tmp/tools\n"),
              coldJob.replace("    steps:\n", "    env:\n      CARGO_HOME: shared-cache\n    steps:\n"),
            ]) {
              assert.throws(() => verifyColdDependencyJob(broken));
            }

            // Execute the actual scripts embedded in both release consumers.
            // API responses are controlled; these checks neither publish nor
            // query another run, and need no extra test service or credentials.
            function releaseScript(path) {
              const text = fs.readFileSync(path, "utf8");
              const section = text.split("- name: Verify the release SHA passed full CI on main\n")[1];
              const lines = section.split("          script: |\n")[1].split("\n");
              const body = [];
              for (const line of lines) {
                if (line.trim() && !line.startsWith("            ")) break;
                body.push(line.slice(12));
              }
              return body.join("\n");
            }
            const publish = releaseScript(".github/workflows/publish.yml");
            assert.equal(publish, releaseScript(".github/workflows/dry-run.yml"));
            const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
            const qualify = new AsyncFunction("github", "context", "core", "process", publish);
            const sha = "qualified-revision";
            const run = {id: 1, head_sha: sha, head_branch: "main", event: "push",
              status: "completed", conclusion: "success", html_url: "fixture://main", run_number: 1};
            const job = {name: "performance", head_sha: sha, status: "completed", conclusion: "success"};
            for (const [name, candidate, jobs, passes] of [
              ["complete", run, [job], true],
              ["missing run", null, [job], false],
              ["wrong revision", {...run, head_sha: "other"}, [job], false],
              ["PR run", {...run, event: "pull_request"}, [job], false],
              ["wrong branch", {...run, head_branch: "topic"}, [job], false],
              ["unfinished run", {...run, status: "in_progress"}, [job], false],
              ["failed sibling", {...run, conclusion: "failure"}, [job], false],
              ["missing performance", run, [], false],
              ["skipped performance", run, [{...job, conclusion: "skipped"}], false],
              ["failed performance", run, [{...job, conclusion: "failure"}], false],
              ["cancelled performance", run, [{...job, conclusion: "cancelled"}], false],
              ["unfinished performance", run, [{...job, status: "in_progress", conclusion: null}], false],
              ["wrong performance revision", run, [{...job, head_sha: "other"}], false],
              ["ambiguous performance", run, [job, job], false],
            ]) {
              const outputs = {};
              const api = {
                request: async (_, query) => {
                  assert.equal(query.head_sha, sha);
                  assert.equal(query.branch, "main");
                  assert.equal(query.event, "push");
                  return {data: {workflow_runs: candidate ? [candidate] : []}};
                },
                rest: {actions: {listJobsForWorkflowRun: "jobs"}},
                paginate: async (_, query) => {
                  assert.equal(query.run_id, run.id);
                  assert.equal(query.filter, "latest");
                  return jobs;
                },
              };
              const attempt = qualify(api, {repo: {owner: "fixture", repo: "fixture"}},
                {info: () => {}, setOutput: (key, value) => outputs[key] = value},
                {env: {RELEASE_SHA: sha}});
              if (passes) {
                await attempt;
                assert.equal(outputs.run_url, run.html_url, name);
              } else {
                await assert.rejects(attempt, undefined, name);
                assert.deepEqual(outputs, {}, name);
              }
            }
            core.info("Cadence, cold-dependency scope and exact-release evidence controls passed.");

      - name: Verify SPDX headers
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          
          import subprocess
          import sys
          from pathlib import Path
          
          expected = [
              "// SPDX-License-Identifier: MIT OR Apache-2.0",
              "// SPDX-FileCopyrightText: 2025-2026 ObzenFlow Contributors",
              "// https://obzenflow.dev",
          ]
          
          files = subprocess.check_output(["git", "ls-files", "*.rs"], text=True).splitlines()
          bad: list[tuple[str, list[str]]] = []
          for f in files:
              lines = Path(f).read_text(encoding="utf-8").splitlines()
              got = lines[:3]
              if got != expected:
                  bad.append((f, got))
          
          if bad:
              print("SPDX header mismatch in Rust files:")
              for f, got in bad:
                  print(f" - {f}")
                  for i, line in enumerate(got or ["<missing>"] * 3, start=1):
                      print(f"   {i}: {line}")
              sys.exit(1)
          
          print(f"SPDX headers OK in {len(files)} Rust files")
          PY

      - name: Verify license files
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import glob
          import re
          import sys
          from pathlib import Path

          REQUIRED = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
          root = Path(".")
          errors: list[str] = []

          # --- 1. Discover crate directories dynamically ---
          crate_dirs = sorted(
              Path(p).parent for p in glob.glob("crates/*/Cargo.toml")
          )
          if not crate_dirs:
              print("No crates found under crates/*/Cargo.toml")
              sys.exit(1)

          # --- 2. Presence check ---
          for name in REQUIRED:
              if not (root / name).is_file():
                  errors.append(f"Missing root {name}")

          for crate_dir in crate_dirs:
              for name in REQUIRED:
                  if not (crate_dir / name).is_file():
                      errors.append(f"Missing {crate_dir / name}")

          # --- 3. Byte-identity check ---
          for crate_dir in crate_dirs:
              for name in REQUIRED:
                  root_file = root / name
                  crate_file = crate_dir / name
                  if root_file.is_file() and crate_file.is_file():
                      if root_file.read_bytes() != crate_file.read_bytes():
                          errors.append(
                              f"{crate_file} differs from root {name}"
                          )

          # --- 4. Copyright year consistency ---
          # Single source of truth: the SPDX header expected value (line 2 in
          # the SPDX check above).
          spdx_copyright = (
              "// SPDX-FileCopyrightText: 2025-2026 ObzenFlow Contributors"
          )
          m = re.search(r"(\d{4}(?:-\d{4})?)", spdx_copyright)
          if not m:
              errors.append("Cannot extract year range from SPDX header")
          else:
              spdx_years = m.group(1)
              mit = root / "LICENSE-MIT"
              if mit.is_file():
                  mit_lines = mit.read_text(encoding="utf-8").splitlines()
                  if len(mit_lines) < 3:
                      errors.append("LICENSE-MIT has fewer than 3 lines")
                  else:
                      cm = re.search(r"(\d{4}(?:-\d{4})?)", mit_lines[2])
                      if not cm:
                          errors.append(
                              "Cannot extract year from LICENSE-MIT line 3"
                          )
                      elif cm.group(1) != spdx_years:
                          errors.append(
                              f"Year mismatch: SPDX header has {spdx_years}, "
                              f"LICENSE-MIT line 3 has {cm.group(1)}"
                          )

          if errors:
              print("License file check failed:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)

          print(
              f"License files OK: {len(REQUIRED)} files verified across "
              f"root + {len(crate_dirs)} crate(s)"
          )
          PY

      - name: Verify supervised_base sealing
        run: |
          ! grep -n '^pub mod base;' crates/obzenflow_runtime/src/supervised_base/mod.rs
          ! grep -n 'pub use base::Supervisor' crates/obzenflow_runtime/src/supervised_base/mod.rs

      - name: Guard against barrier sleeps in synchronisation-sensitive tests
        run: |
          set -euo pipefail

          # FLOWIP-114n: these files were migrated away from wall-clock sleeps as
          # synchronisation barriers. Any remaining `tokio::time::sleep(...)` must
          # be explicitly annotated to avoid regressions.
          matches="$(
            rg -n 'tokio::time::sleep\(' \
              tests/cycle_convergence_eof_gating_test.rs \
              tests/cycle_unified_guard_test.rs \
              tests/divergence_mid_flight_abort_test.rs \
              crates/obzenflow_infra/tests/ancestry_fan_in_join.rs \
              crates/obzenflow_infra/tests/live_reference_join.rs \
              crates/obzenflow_infra/tests/replay_determinism.rs \
              || true
          )"

          if [[ -z "${matches}" ]]; then
            echo "OK: no tokio::time::sleep(...) calls found in FLOWIP-114n migrated files."
            exit 0
          fi

          violations="$(printf '%s\n' "${matches}" | rg -v 'hang-guard:' || true)"
          if [[ -n "${violations}" ]]; then
            echo "Found tokio::time::sleep(...) without // hang-guard: annotation:"
            echo "${violations}"
            exit 1
          fi

          echo "OK: all tokio::time::sleep(...) calls are annotated with // hang-guard:."

      - name: Guard the runtime execution strategy
        run: |
          set -euo pipefail

          # FLOWIP-120r: the replay-versus-live decision is owned by the runtime
          # execution strategy (crate::execution). Branching on replay-archive
          # presence for a mode/phase decision is forbidden outside the single
          # bootstrap selector (resources_builder.rs); archive access goes
          # through RuntimeExecution::archive_for_io().
          archive_branches="$(
            rg -n '\.replay_archive\.is_some\(\)|if let Some\([^)]*\)\s*=\s*[^;]*\.replay_archive' \
              crates/obzenflow_runtime/src crates/obzenflow_dsl/src \
              -g '!**/resources_builder.rs' -g '!**/tests.rs' -g '!**/tests/**' \
              || true
          )"
          if [[ -n "${archive_branches}" ]]; then
            echo "FLOWIP-120r: forbidden replay-archive mode/phase branch (use crate::execution):"
            echo "${archive_branches}"
            exit 1
          fi

          # `scope_for_dispatch` is retired; `RuntimeExecution::handler_scope_for`
          # / `dispatch_scope` replace it. `EffectRuntimeMode` survives only as a
          # `#[cfg(test)]` parameterization aid, which the compiler keeps out of
          # production builds.
          if rg -n 'scope_for_dispatch' crates/obzenflow_runtime/src crates/obzenflow_dsl/src; then
            echo "FLOWIP-120r: scope_for_dispatch is retired; use the runtime execution strategy."
            exit 1
          fi

          # archive_for_io() is an I/O accessor, not a phase predicate. A direct
          # presence-branch on it (`if let Some(...) = ...archive_for_io()` or
          # `.archive_for_io().is_some()`) is the Gap-1 misuse: the replay-vs-live
          # decision must come from source_phase_for / the strategy. Genuine I/O
          # binds the archive separately first (see the `// archive-io:` effect-
          # history loads), which does not match these patterns.
          afio="$(
            rg -n '\.archive_for_io\(\)\.is_some\(\)|if let Some\([^)]*\)\s*=\s*[^;]*\.archive_for_io\(\)' \
              crates/obzenflow_runtime/src crates/obzenflow_dsl/src \
              -g '!**/resources_builder.rs' -g '!**/tests.rs' -g '!**/tests/**' \
              || true
          )"
          if [[ -n "${afio}" ]]; then
            echo "FLOWIP-120r: archive_for_io() used as a phase predicate (use source_phase_for / the strategy):"
            echo "${afio}"
            exit 1
          fi

          echo "OK: replay/live decisions go through the runtime execution strategy."

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: cargo-deny
        run: |
          rm -rf target/advisory-dbs
          cargo deny --all-features check

      - name: cargo-machete
        run: cargo machete --skip-target-dir
