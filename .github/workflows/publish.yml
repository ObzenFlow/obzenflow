name: Publish to crates.io
run-name: Publish ${{ inputs.package }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Workspace version to publish; must match an existing tag vX.Y.Z"
        required: true
        type: string
      package:
        description: "One crate to publish in maintainer-controlled dependency order"
        required: true
        type: choice
        options:
          - obzenflow_core_derive
          - obzenflow_core
          - obzenflow_runtime
          - obzenflow_adapters
          - obzenflow_dsl
          - obzenflow_infra
          - obzenflow

# A workspace version is published one crate at a time. A second dispatch for the
# same version queues instead of racing the currently selected crate.
concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      REQUESTED_PACKAGE: ${{ inputs.package }}
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Validate release inputs
        run: |
          set -euo pipefail

          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be X.Y.Z or X.Y.Z-prerelease, got '$REQUESTED_VERSION'"
            exit 1
          fi

          case "$REQUESTED_PACKAGE" in
            obzenflow_core_derive|obzenflow_core|obzenflow_runtime|obzenflow_adapters|obzenflow_dsl|obzenflow_infra|obzenflow)
              ;;
            *)
              echo "::error::package is not in the publishable ObzenFlow crate set: '$REQUESTED_PACKAGE'"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}

      - name: Pin the checked-out commit
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify the release SHA passed full CI on main
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
        with:
          script: |
            const releaseSha = process.env.RELEASE_SHA;
            const { data } = await github.request(
              "GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs",
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ci.yml",
                branch: "main",
                event: "push",
                status: "success",
                head_sha: releaseSha,
                per_page: 100,
              },
            );

            const run = data.workflow_runs.find((candidate) =>
              candidate.head_sha === releaseSha &&
              candidate.head_branch === "main" &&
              candidate.event === "push" &&
              candidate.status === "completed" &&
              candidate.conclusion === "success"
            );

            if (!run) {
              throw new Error(
                `No successful full main CI run exists for release SHA ${releaseSha}. ` +
                "Wait for the push-to-main CI run to pass, then dispatch again."
              );
            }

            core.info(`Release SHA ${releaseSha} is sealed by ${run.html_url}`);
            await core.summary
              .addHeading("Release CI seal", 3)
              .addTable([
                [
                  { data: "Release SHA", header: true },
                  { data: "Main CI run", header: true },
                ],
                [releaseSha, `<a href="${run.html_url}">#${run.run_number}</a>`],
              ])
              .write();

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Verify every release package
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          workspace_version="$(
            jq -r '.packages[] | select(.name == "obzenflow") | .version' <<< "$metadata"
          )"
          [[ "$workspace_version" == "$REQUESTED_VERSION" ]] || \
            fail "tag v$REQUESTED_VERSION has workspace version $workspace_version"

          # Match cargo publish --workspace: publish = false is represented by
          # an empty array in metadata. Check the whole release before allowing
          # even its first crate to upload.
          release_packages="$(
            jq -r '.packages[] | select(.publish != []) | .name' <<< "$metadata"
          )"
          grep -Fqx -- "$REQUESTED_PACKAGE" <<< "$release_packages" || \
            fail "package '$REQUESTED_PACKAGE' is absent from the publishable workspace"

          required_files=(
            Cargo.toml
            README.md
            TRADEMARKS.md
            LICENSE-MIT
            LICENSE-APACHE
            NOTICE
          )
          while IFS= read -r package_name; do
            package="$(
              jq -ce --arg name "$package_name" \
                '.packages[] | select(.name == $name)' <<< "$metadata"
            )"
            package_version="$(jq -r '.version' <<< "$package")"
            package_license="$(jq -r '.license // ""' <<< "$package")"
            package_root="$(dirname "$(jq -r '.manifest_path' <<< "$package")")"

            [[ "$package_version" == "$REQUESTED_VERSION" ]] || \
              fail "$package_name has version $package_version, expected $REQUESTED_VERSION"
            [[ "$package_license" == "MIT OR Apache-2.0" ]] || \
              fail "$package_name has unexpected license metadata: '$package_license'"

            package_files="$(
              cargo package --package "$package_name" --locked --list
            )"

            for file in "${required_files[@]}"; do
              grep -Fqx -- "$file" <<< "$package_files" || \
                fail "$package_name archive is missing $file"
            done

            while IFS= read -r file; do
              case "$file" in
                .cargo_vcs_info.json|Cargo.lock|Cargo.toml|Cargo.toml.orig|README.md|TRADEMARKS.md|LICENSE-MIT|LICENSE-APACHE|NOTICE|src/*.rs|src/README.md|src/*/README.md)
                  ;;
                *)
                  fail "$package_name archive contains unexpected file: $file"
                  ;;
              esac
            done <<< "$package_files"

            for file in TRADEMARKS.md LICENSE-MIT LICENSE-APACHE NOTICE; do
              cmp -s "$GITHUB_WORKSPACE/$file" "$package_root/$file" || \
                fail "$package_name/$file differs from the canonical root copy"
            done

            printf 'package=%s requested=%s workspace=%s\n' \
              "$package_name" "$REQUESTED_VERSION" "$workspace_version"
            printf '%s\n' "$package_files"

            {
              printf '### %s %s files\n\n' "$package_name" "$REQUESTED_VERSION"
              printf 'Tag: v%s\n\n' "$REQUESTED_VERSION"
              printf 'Commit: %s\n\n' "$(git rev-parse HEAD)"
              printf '```text\n%s\n```\n' "$package_files"
            } >> "$GITHUB_STEP_SUMMARY"
          done <<< "$release_packages"

      - uses: Swatinem/rust-cache@v2

      - name: Dry-run the entire release before any upload
        # Cargo stages unpublished workspace dependencies together, so this
        # verifies every archive even on the first per-crate dispatch.
        run: cargo publish --workspace --locked --dry-run

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      REQUESTED_PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish the selected crate
        run: cargo publish --package "$REQUESTED_PACKAGE" --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
